services:
  tag-doctor:
    build: .
    container_name: tag-doctor
    ports:
      - "8991:8991"
    volumes:
      - ./data:/data
      - "/media/1tb/ Music:/music"
      # Optional - lets the "Arquivos ausentes no Navidrome" panel work. Needs write
      # access: purging is a DELETE in Navidrome's own database.
      # - /DATA/AppData/navidrome/data:/navidrome-data
    environment:
      MUSIC_DIR: /music
      DATA_DIR: /data
      # Optional - lets the "Forçar rescan no Navidrome" button work:
      # ND_URL: http://navidrome:4533
      # ND_USER: admin
      # ND_PASS: changeme
      # Optional - enables the missing-files cleanup:
      # ND_DB: /navidrome-data/navidrome.db
      # Where Navidrome's library is visible from THIS container. Only needed when the
      # two containers mount the library at different paths - the cleanup cross-checks
      # every row against the real files before deleting anything.
      # ND_LIBRARY_DIR: /music
